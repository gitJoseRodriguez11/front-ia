<main class="chat-shell">
  <section class="chat-card">
    <header class="chat-header">
      <div>
        <h1>MIA <p>by TISAL</p></h1>
        <p><strong>Impulsamos Tecnologías para una salud que funciona, evoluciona y te cuida.</strong></p>
      </div>
      <span class="session-pill">Sesion activa</span>
    </header>

    <section #messagesContainer class="messages" aria-live="polite">
      @for (message of messages; track trackByIndex($index)) {
        <article class="message" [class.user]="message.role === 'user'" [class.assistant]="message.role === 'assistant'">
          <span class="role">{{ message.role === 'user' ? 'Tu' : 'MIA' }}</span>
          <pre>{{ message.text }}</pre>
        </article>
      }

      @if (isLoading) {
        <article class="message assistant pending">
          <span class="role">MIA</span>
          <pre>Consultando servicio...</pre>
        </article>
      }
    </section>

    <form class="chat-form" (ngSubmit)="send()">
      <div class="form-brand" aria-hidden="true">
        <img
          src="https://media.licdn.com/dms/image/v2/D4E0BAQH2XshtZ7Ip9A/company-logo_200_200/B4EZpPW31TIQAM-/0/1762267987943/tisal_spa_logo?e=2147483647&v=beta&t=-93I_v5GiXLtfxIcmW_iDFqyCboKR_Pz1p5oz8q-V0k"
          alt="Logo Tisal"
          loading="lazy"
        />
      </div>

      <label for="prompt">Mensaje</label>
      <textarea
        id="prompt"
        name="prompt"
        [(ngModel)]="prompt"
        rows="3"
        placeholder="Escribe tu consulta..."
        required
      ></textarea>

      <button type="submit" [disabled]="isLoading || !prompt.trim()">
        {{ isLoading ? 'Enviando...' : 'Enviar' }}
      </button>
    </form>
  </section>
</main>
